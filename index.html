<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo Jalean - WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .lds-ring {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
            margin: 20px auto;
        }
        
        .lds-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 64px;
            height: 64px;
            margin: 8px;
            border: 8px solid #25D366;
            border-radius: 50%;
            animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #25D366 transparent transparent transparent;
        }
        
        .lds-ring div:nth-child(1) { animation-delay: -0.45s; }
        .lds-ring div:nth-child(2) { animation-delay: -0.3s; }
        .lds-ring div:nth-child(3) { animation-delay: -0.15s; }
        
        @keyframes lds-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .error {
            color: #e74c3c;
            background: #fde8e8;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .success {
            color: #27ae60;
            background: #e8f8ed;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .info {
            color: #3498db;
            background: #e8f4fd;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 13px;
        }
        
        .footer {
            margin-top: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }
        
        .btn-reintentar {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .btn-reintentar:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>QR Campo Jalean</h1>
        <p class="subtitle">Conectando con WhatsApp</p>
        
        <div id="loader">
            <div class="lds-ring">
                <div></div><div></div><div></div><div></div>
            </div>
            <p class="status">⏳ Procesando tu solicitud...</p>
        </div>
        
        <div id="info-adicional" style="display: none;" class="info">
            🔒 Escaneo registrado correctamente
        </div>
        
        <div id="resultado" style="display: none;"></div>
    </div>
    
    <div class="footer">
        © 2026 Campo Jalean · Todos los derechos reservados
    </div>
    
    <script>
        // CONFIGURACIÓN - ¡ACTUALIZA CON TU URL DE APPS SCRIPT!
        const AS_URL_BASE = "https://script.google.com/macros/s/AKfycbwT_9C8hbZHmTFgkhIwnH8uQ_krOzKdOq3dFyArbXybXBje2bZQta7PA5m7jCL_c-9s/exec";
        
        // Función para obtener la IP del usuario
        async function getClientIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.log('No se pudo obtener IP:', error);
                return '0.0.0.0';
            }
        }
        
        // Función principal mejorada
        async function redirigir() {
            const loader = document.getElementById('loader');
            const resultado = document.getElementById('resultado');
            const infoAdicional = document.getElementById('info-adicional');
            
            try {
                // Obtener parámetro k de la URL
                const urlParams = new URLSearchParams(window.location.search);
                const k = urlParams.get('k');
                
                if (!k) {
                    mostrarError('Código QR inválido. Por favor, escanea un QR válido.');
                    return;
                }
                
                // Obtener IP del usuario
                const ip = await getClientIP();
                
                // Construir URL con parámetros adicionales
                const userAgent = encodeURIComponent(navigator.userAgent);
                const urlCompleta = `${AS_URL_BASE}?k=${encodeURIComponent(k)}&ip=${ip}&ua=${userAgent}`;
                
                // Llamar a Apps Script con más datos
                const response = await fetch(urlCompleta);
                
                if (!response.ok) {
                    throw new Error('Error de red: ' + response.status);
                }
                
                const destino = await response.text();
                
                // Validar que sea una URL
                if (destino.startsWith('http://') || destino.startsWith('https://')) {
                    // Mostrar mensaje de éxito
                    loader.innerHTML = `
                        <div class="success">✅ ¡Escaneo registrado exitosamente!</div>
                        <p class="status" style="margin-top:10px;">Redirigiendo a WhatsApp en 2 segundos...</p>
                    `;
                    
                    // Mostrar información adicional
                    infoAdicional.style.display = 'block';
                    infoAdicional.innerHTML = `
                        📊 Registro #${new Date().getTime()} completado<br>
                        🔑 QR: ${k}
                    `;
                    
                    setTimeout(() => {
                        window.location.href = destino;
                    }, 2000);
                    
                } else {
                    mostrarError('No se encontró el destino para este código QR.');
                }
                
            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error de conexión. Por favor, intenta de nuevo.');
            }
        }
        
        function mostrarError(mensaje) {
            const loader = document.getElementById('loader');
            const resultado = document.getElementById('resultado');
            loader.style.display = 'none';
            resultado.style.display = 'block';
            resultado.innerHTML = `
                <div class="error">❌ ${mensaje}</div>
                <br>
                <button onclick="window.location.reload()" class="btn-reintentar">
                    🔄 Reintentar
                </button>
            `;
        }
        
        // Iniciar la redirección
        document.addEventListener('DOMContentLoaded', redirigir);
    </script>
</body>
</html>

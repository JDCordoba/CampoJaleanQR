<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Esto es CLAVE para que calce perfecto en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campo Jalean</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset absoluto para que no sobre nada */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(145deg, #1a2b4c 0%, #3a507a 100%);
            min-height: 100vh; /* Ocupa el 100% de la altura de la pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            /* Esto evita scrolls innecesarios */
            overflow: hidden; 
        }
        
        /* Tarjeta central - AHORA CALZA PERFECTO EN EL CELULAR */
        .contenedor {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 30px;
            /* ANCHO: Ocupa el 90% de la pantalla del celular, hasta un tope de 400px en PC */
            width: 90%;
            max-width: 400px; 
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: aparecer 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes aparecer {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Ajuste del logo */
        .logo {
            max-width: 160px;
            width: 100%;
            height: auto;
            margin: 0 auto 20px auto; /* Centrado perfecto */
            display: block;
            image-rendering: auto;
        }

        h1 {
            color: #1a2b4c;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        
        p {
            color: #555;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 25px;
            padding: 0 10px; /* Para que el texto no toque los bordes en pantallas muy chicas */
        }

        /* Indicador de carga */
        .loader {
            display: inline-block;
            width: 35px;
            height: 35px;
            border: 4px solid #e0e7ff;
            border-top: 4px solid #1a2b4c;
            border-radius: 50%;
            animation: girar 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .texto-carga {
            color: #888;
            font-size: 15px;
            font-weight: 400;
        }

        /* Texto pequeño de pie de página - AHORA BIEN UBICADO */
        .footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <img src="logo.png" alt="Campo Jalean" class="logo">
        
        <h1>Bienvenido</h1>
        <p>Estamos preparando tu acceso...</p>

        <div class="loader"></div>
        <div class="texto-carga">Conectando con WhatsApp</div>
    </div>
    
    <div class="footer">
        Powered by Campo Jalean
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN
        // ==========================================
        
        // 🔴 TU LINK DE APPS SCRIPT
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/TU_ID_DE_SCRIPT_AQUI/exec";
        
        // 🔴 TU LINK DE WHATSAPP
        const URL_DESTINO_FINAL = "https://wa.link/d81gs7";

        // ==========================================
        // SISTEMA DE REGISTRO AUTOMÁTICO
        // ==========================================

        async function obtenerIP() {
            try {
                const respuesta = await fetch('https://api.ipify.org?format=json');
                const datos = await respuesta.json();
                return datos.ip;
            } catch (error) {
                return '0.0.0.0';
            }
        }

        async function ejecutarRegistroYRedirigir() {
            try {
                const params = new URLSearchParams(window.location.search);
                const claveQR = params.get('k') || '1';
                const ip = await obtenerIP();
                const userAgent = encodeURIComponent(navigator.userAgent);

                const urlCompleta = `${URL_APPS_SCRIPT}?k=${encodeURIComponent(claveQR)}&ip=${ip}&ua=${userAgent}`;

                // Registrar en segundo plano
                fetch(urlCompleta).catch(e => console.log("Registro silencioso"));

                // Redirigir después de 1.5 segundos
                setTimeout(() => {
                    window.location.href = URL_DESTINO_FINAL;
                }, 1500);

            } catch (error) {
                setTimeout(() => {
                    window.location.href = URL_DESTINO_FINAL;
                }, 1500);
            }
        }

        document.addEventListener('DOMContentLoaded', ejecutarRegistroYRedirigir);
    </script>

</body>
</html>

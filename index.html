<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campo Jalean</title>
    
    <!-- Fuente Poppins para un look moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset básico */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            /* Fondo con degradado elegante (azul oscuro corporativo a gris suave) */
            background: linear-gradient(145deg, #1a2b4c 0%, #3a507a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        
        /* Tarjeta flotante central (Glassmorphism) */
        .contenedor {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: aparecer 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de entrada suave */
        @keyframes aparecer {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Ajuste del logo */
        .logo {
            max-width: 180px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            image-rendering: auto;
        }

        h1 {
            color: #1a2b4c;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        p {
            color: #555;
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 25px;
        }

        /* Indicador de carga elegante */
        .loader {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #e0e7ff;
            border-top: 4px solid #1a2b4c;
            border-radius: 50%;
            animation: girar 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .texto-carga {
            color: #888;
            font-size: 14px;
            font-weight: 400;
        }

        /* Texto pequeño de pie de página */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <!-- Logo de la empresa -->
        <img src="logo.png" alt="Campo Jalean" class="logo">
        
        <h1>Bienvenido</h1>
        <p>Estamos preparando tu acceso...</p>

        <!-- Indicador visual de que está funcionando -->
        <div class="loader"></div>
        <div class="texto-carga">Conectando con WhatsApp</div>
    </div>
    
    <div class="footer">
        Powered by Campo Jalean
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DEL SISTEMA
        // ==========================================
        
        // 🔴 REEMPLAZA ESTO CON EL LINK DE TU APPS SCRIPT
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/TU_ID_DE_SCRIPT_AQUI/exec";
        
        // 🔴 REEMPLAZA ESTO CON EL LINK DE WHATSAPP AL QUE QUIERES QUE LLEGUE
        const URL_DESTINO_FINAL = "https://wa.link/d81gs7";

        // ==========================================
        // SISTEMA DE REGISTRO AUTOMÁTICO
        // ==========================================

        async function obtenerIP() {
            try {
                const respuesta = await fetch('https://api.ipify.org?format=json');
                const datos = await respuesta.json();
                return datos.ip;
            } catch (error) {
                return '0.0.0.0';
            }
        }

        async function ejecutarRegistroYRedirigir() {
            try {
                // 1. Obtener la clave del QR (si viene en la URL, ej: ?k=1)
                const params = new URLSearchParams(window.location.search);
                const claveQR = params.get('k') || '1'; // Si no tiene, usa 1 por defecto

                // 2. Obtener datos del usuario (IP y Navegador)
                const ip = await obtenerIP();
                const userAgent = encodeURIComponent(navigator.userAgent);

                // 3. Construir el enlace para Apps Script
                const urlCompleta = `${URL_APPS_SCRIPT}?k=${encodeURIComponent(claveQR)}&ip=${ip}&ua=${userAgent}`;

                // 4. Enviar el registro (No esperamos respuesta para que sea rápido y silencioso)
                fetch(urlCompleta).catch(error => console.log("Registro en segundo plano"));

                // 5. Esperar 1.5 segundos para que el usuario vea el logo y luego redirigir
                setTimeout(() => {
                    window.location.href = URL_DESTINO_FINAL;
                }, 1500); // 1500 milisegundos = 1.5 segundos

            } catch (error) {
                // Si falla todo, igual lo mandamos a WhatsApp para que no se quede tirado
                setTimeout(() => {
                    window.location.href = URL_DESTINO_FINAL;
                }, 1500);
            }
        }

        // Cuando la página carga, ejecutamos el sistema automáticamente
        document.addEventListener('DOMContentLoaded', ejecutarRegistroYRedirigir);
    </script>

</body>
</html>

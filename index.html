<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campo Jalean</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: #ffffff;
            border-radius: 24px;
            padding: 45px 30px 35px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        
        .logo {
            max-width: 160px;
            width: 100%;
            height: auto;
            margin: 0 auto 20px;
            display: block;
        }
        
        h1 {
            color: #0f172a;
            margin-bottom: 6px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 15px;
            font-weight: 400;
        }
        
        .lds-ring {
            display: inline-block;
            position: relative;
            width: 64px;
            height: 64px;
            margin: 10px auto;
        }
        
        .lds-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 48px;
            height: 48px;
            margin: 8px;
            border: 5px solid #1e293b;
            border-radius: 50%;
            animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #1e293b transparent transparent transparent;
        }
        
        .lds-ring div:nth-child(1) { animation-delay: -0.45s; }
        .lds-ring div:nth-child(2) { animation-delay: -0.3s; }
        .lds-ring div:nth-child(3) { animation-delay: -0.15s; }
        
        @keyframes lds-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status {
            margin-top: 18px;
            color: #64748b;
            font-size: 14px;
            font-weight: 400;
        }
        
        .error {
            color: #dc2626;
            background: #fef2f2;
            padding: 14px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .btn-reintentar {
            padding: 12px 30px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 500;
            margin-top: 15px;
            transition: background 0.2s;
        }
        
        .btn-reintentar:hover {
            background: #1e293b;
        }

        .footer {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGO -->
        <img src="logo.png" alt="Campo Jalean" class="logo">
        
        <h1>Campo Jalean</h1>
        <p class="subtitle">Conectando con WhatsApp</p>
        
        <div id="loader">
            <div class="lds-ring">
                <div></div><div></div><div></div><div></div>
            </div>
            <p class="status">⏳ Un momento...</p>
        </div>
        
        <div id="resultado" style="display: none;"></div>
    </div>
    
    <div class="footer">
        © 2026 Campo Jalean
    </div>
    
    <script>
        // ==========================================
        // CONFIGURACIÓN - ACTUALIZA CON TUS DATOS
        // ==========================================
        const AS_URL_BASE = "https://script.google.com/macros/s/AKfycbwT_9C8hbZHmTFgkhIwnH8uQ_krOzKdOq3dFyArbXybXBje2bZQta7PA5m7jCL_c-9s/exec";
        const URL_DESTINO_FINAL = "https://wa.link/d81gs7"; // Link fijo de WhatsApp
        
        // ==========================================
        // LÓGICA DE REGISTRO AUTOMÁTICO
        // ==========================================
        async function getClientIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return '0.0.0.0';
            }
        }
        
        async function ejecutarRegistroYRedirigir() {
            try {
                // Obtener parámetro k (Clave QR)
                const urlParams = new URLSearchParams(window.location.search);
                const k = urlParams.get('k') || '1';
                
                // Obtener IP
                const ip = await getClientIP();
                const userAgent = encodeURIComponent(navigator.userAgent);
                const urlCompleta = `${AS_URL_BASE}?k=${encodeURIComponent(k)}&ip=${ip}&ua=${userAgent}`;
                
                // ENVIAR EL REGISTRO EN SEGUNDO PLANO (No esperamos respuesta)
                fetch(urlCompleta).catch(e => console.log("Registro en segundo plano"));
                
                // REDIRIGIR CASI INSTANTÁNEAMENTE (700 milisegundos)
                setTimeout(() => {
                    window.location.href = URL_DESTINO_FINAL;
                }, 700);
                
            } catch (error) {
                // Si algo falla, igual lo mandamos a WhatsApp
                setTimeout(() => {
                    window.location.href = URL_DESTINO_FINAL;
                }, 700);
            }
        }
        
        function mostrarError(mensaje) {
            const loader = document.getElementById('loader');
            const resultado = document.getElementById('resultado');
            loader.style.display = 'none';
            resultado.style.display = 'block';
            resultado.innerHTML = `
                <div class="error">❌ ${mensaje}</div>
                <br>
                <button onclick="window.location.reload()" class="btn-reintentar">
                    🔄 Reintentar
                </button>
            `;
        }
        
        // Iniciar el proceso al cargar la página
        document.addEventListener('DOMContentLoaded', ejecutarRegistroYRedirigir);
    </script>
</body>
</html>

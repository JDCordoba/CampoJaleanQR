<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campo Jalean - Registro</title>
    <!-- Fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #f4f6f9; 
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            text-align: center;
        }
        
        /* Ajustes del logo de Campo Jalean */
        .logo {
            max-width: 180px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            image-rendering: -webkit-optimize-contrast; 
        }

        h1 {
            color: #1a2b4c;
            margin-bottom: 5px;
            font-size: 22px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }
        
        /* Animación de carga */
        .lds-ring {
            display: inline-block;
            position: relative;
            width: 60px;
            height: 60px;
            margin: 15px auto;
        }
        
        .lds-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 48px;
            height: 48px;
            margin: 6px;
            border: 5px solid #1982c4; /* Color celeste del logo */
            border-radius: 50%;
            animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #1982c4 transparent transparent transparent;
        }
        
        .lds-ring div:nth-child(1) { animation-delay: -0.45s; }
        .lds-ring div:nth-child(2) { animation-delay: -0.3s; }
        .lds-ring div:nth-child(3) { animation-delay: -0.15s; }
        
        @keyframes lds-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
        
        /* Estilos de mensajes de éxito/error */
        .error {
            color: #e74c3c;
            background: #fde8e8;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .success {
            color: #27ae60;
            background: #e8f8ed;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .info {
            color: #1982c4;
            background: #e8f4fd;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 13px;
        }
        
        .btn-reintentar {
            padding: 10px 25px;
            background: #1982c4;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 15px;
            margin-top: 15px;
            transition: background 0.3s;
        }
        
        .btn-reintentar:hover {
            background: #136a9e;
        }
        
        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGO DE CAMPO JALEAN -->
        <img src="logo.png" alt="Campo Jalean" class="logo">
        
        <h1>¡Bienvenido!</h1>
        <p class="subtitle">Registrando tu ingreso...</p>
        
        <div id="loader">
            <div class="lds-ring">
                <div></div><div></div><div></div><div></div>
            </div>
            <p class="status">⏳ Conectando con el sistema...</p>
        </div>
        
        <div id="info-adicional" style="display: none;" class="info">
            🔒 Escaneo registrado correctamente
        </div>
        
        <div id="resultado" style="display: none;"></div>
    </div>
    
    <div class="footer">
        © 2026 Campo Jalean
    </div>
    
    <script>
        // ✅ ACTUALIZA ESTO CON TU URL DE APPS SCRIPT
        const AS_URL_BASE = "https://script.google.com/macros/s/AKfycbwT_9C8hbZHmTFgkhIwnH8uQ_krOzKdOq3dFyArbXybXBje2bZQta7PA5m7jCL_c-9s/exec";
        
        // Función para obtener la IP del usuario
        async function getClientIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.log('No se pudo obtener IP:', error);
                return '0.0.0.0';
            }
        }
        
        // Función principal
        async function procesarRegistro() {
            const loader = document.getElementById('loader');
            const resultado = document.getElementById('resultado');
            const infoAdicional = document.getElementById('info-adicional');
            
            try {
                // Obtener parámetro k de la URL
                const urlParams = new URLSearchParams(window.location.search);
                const k = urlParams.get('k');
                
                if (!k) {
                    mostrarError('Código QR inválido. Por favor, escanea un QR válido.');
                    return;
                }
                
                // Obtener IP del usuario
                const ip = await getClientIP();
                
                // Construir URL con parámetros
                const userAgent = encodeURIComponent(navigator.userAgent);
                const urlCompleta = `${AS_URL_BASE}?k=${encodeURIComponent(k)}&ip=${ip}&ua=${userAgent}`;
                
                // Llamar a Apps Script
                const response = await fetch(urlCompleta);
                
                if (!response.ok) {
                    throw new Error('Error de red: ' + response.status);
                }
                
                const destino = await response.text();
                
                // Validar que sea una URL
                if (destino.startsWith('http://') || destino.startsWith('https://')) {
                    // Mostrar mensaje de éxito
                    loader.innerHTML = `
                        <div class="success">✅ ¡Escaneo registrado exitosamente!</div>
                        <p class="status" style="margin-top:10px;">Redirigiendo al destino en 2 segundos...</p>
                    `;
                    
                    // Mostrar información adicional
                    infoAdicional.style.display = 'block';
                    infoAdicional.innerHTML = `
                        📊 Registro completado<br>
                        🔑 QR: ${k}
                    `;
                    
                    setTimeout(() => {
                        window.location.href = destino;
                    }, 2000);
                    
                } else {
                    mostrarError('No se encontró el destino para este código QR.');
                }
                
            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error de conexión. Por favor, intenta de nuevo.');
            }
        }
        
        function mostrarError(mensaje) {
            const loader = document.getElementById('loader');
            const resultado = document.getElementById('resultado');
            loader.style.display = 'none';
            resultado.style.display = 'block';
            resultado.innerHTML = `
                <div class="error">❌ ${mensaje}</div>
                <br>
                <button onclick="window.location.reload()" class="btn-reintentar">
                    🔄 Reintentar
                </button>
            `;
        }
        
        // Iniciar el proceso cuando la página cargue
        document.addEventListener('DOMContentLoaded', procesarRegistro);
    </script>
    
</body>
</html>

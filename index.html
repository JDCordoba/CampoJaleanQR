<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campo Jalean</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #f4f6f9;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        
        .logo {
            max-width: 200px;
            width: 100%;
            height: auto;
            margin-bottom: 25px;
        }

        h1 {
            color: #1a2b4c;
            font-size: 22px;
            margin-bottom: 10px;
        }
        
        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }
        
        .btn-whatsapp {
            display: inline-block;
            background-color: #25D366; /* Color oficial de WhatsApp */
            color: white;
            padding: 16px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        
        .btn-whatsapp:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);
        }
        
        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGO DE CAMPO JALEAN -->
        <img src="logo.png" alt="Campo Jalean" class="logo">
        
        <h1>¡Hola!</h1>
        <p>Hacé clic en el botón para comunicarte con nosotros.</p>
        
        <!-- El botón que ejecuta el sistema invisible -->
        <button id="botonAcceso" class="btn-whatsapp">
            📱 Abrir WhatsApp
        </button>
    </div>
    
    <div class="footer">
        © 2026 Campo Jalean
    </div>
    
    <script>
        // 🔴 ACTUALIZA ESTO CON TU URL DE APPS SCRIPT REAL
        const AS_URL_BASE = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";
        const DESTINO_FINAL = "https://wa.link/d81gs7"; // El link de WhatsApp al que quieres llevarlo

        // Función para obtener la IP
        async function getClientIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return '0.0.0.0';
            }
        }

        // Acción al hacer clic en el botón
        document.getElementById('botonAcceso').addEventListener('click', async function() {
            const boton = this;
            
            // 1. Deshabilitar el botón momentáneamente para evitar dobles clics
            boton.disabled = true;
            boton.innerText = "Cargando...";
            boton.style.opacity = "0.7";

            try {
                // 2. Obtener datos necesarios
                const urlParams = new URLSearchParams(window.location.search);
                const k = urlParams.get('k') || '1'; // Si no tiene parámetro, usa 1 por defecto
                const ip = await getClientIP();
                const userAgent = encodeURIComponent(navigator.userAgent);

                // 3. Enviar el registro (en background, invisible para el usuario)
                const urlCompleta = `${AS_URL_BASE}?k=${encodeURIComponent(k)}&ip=${ip}&ua=${userAgent}`;
                
                // Hacemos el fetch pero no esperamos su respuesta para no retrasar el viaje a WhatsApp
                fetch(urlCompleta).catch(e => console.log("Registro en segundo plano"));

                // 4. Redirigir inmediatamente a WhatsApp
                window.location.href = DESTINO_FINAL;

            } catch (error) {
                // Si falla el registro, igual lo llevamos a WhatsApp para que no se quede sin acceso
                window.location.href = DESTINO_FINAL;
            }
        });
    </script>
</body>
</html>

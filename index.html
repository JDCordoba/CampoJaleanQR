<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Campo Jalean</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #333;
            margin: 10px 0;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        /* Spinner de carga */
        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #25D366;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status {
            color: #666;
            font-size: 14px;
        }
        
        .error {
            color: #e74c3c;
            background: #fde8e8;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .success {
            color: #27ae60;
            background: #e8f8ed;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        .footer {
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>QR Campo Jalean</h1>
        <p class="subtitle">Conectando a WhatsApp...</p>
        
        <div id="loader">
            <div class="spinner"></div>
            <p class="status">⏳ Procesando tu solicitud...</p>
        </div>
        
        <div id="resultado" style="display: none;"></div>
        <div id="info" style="display: none; margin-top: 15px; font-size: 13px; color: #666;"></div>
        
        <div class="footer">© 2024 QR Campo Jalean</div>
    </div>
    
    <script>
        // ============================================
        // CONFIGURACIÓN - ¡CAMBIAR ESTO!
        // ============================================
        const AS_URL = "https://script.google.com/macros/s/AKfycbwT_9C8hbZHmTFgkhIwnH8uQ_krOzKdOq3dFyArbXybXBje2bZQta7PA5m7jCL_c-9s/exec"; // <-- PON TU URL
        
        // ============================================
        // FUNCIÓN PRINCIPAL
        // ============================================
        async function redirigir() {
            try {
                // Obtener la clave de la URL
                const params = new URLSearchParams(window.location.search);
                const k = params.get('k');
                
                // Verificar que hay clave
                if (!k) {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('resultado').style.display = 'block';
                    document.getElementById('resultado').innerHTML = `
                        <div class="error">❌ Código QR inválido</div>
                        <p>Por favor, escanea un código QR válido</p>
                    `;
                    return;
                }
                
                // Obtener IP del usuario (para registrar)
                let ip = "0.0.0.0";
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    ip = data.ip;
                } catch (error) {
                    console.log("No se pudo obtener IP");
                }
                
                // Llamar a Apps Script
                const userAgent = encodeURIComponent(navigator.userAgent);
                const urlCompleta = AS_URL + '?k=' + encodeURIComponent(k) + '&ip=' + ip + '&ua=' + userAgent;
                
                const response = await fetch(urlCompleta);
                const destino = await response.text();
                
                // Verificar que es una URL
                if (destino.startsWith('http://') || destino.startsWith('https://')) {
                    // Mostrar éxito
                    document.getElementById('loader').innerHTML = `
                        <div class="success">✅ ¡Escaneo registrado!</div>
                        <p class="status">Redirigiendo a WhatsApp...</p>
                    `;
                    
                    document.getElementById('info').style.display = 'block';
                    document.getElementById('info').textContent = `🔑 QR: ${k} | 📱 IP: ${ip}`;
                    
                    // Redirigir después de 1.5 segundos
                    setTimeout(() => {
                        window.location.href = destino;
                    }, 1500);
                    
                } else {
                    // Error
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('resultado').style.display = 'block';
                    document.getElementById('resultado').innerHTML = `
                        <div class="error">❌ No se encontró el destino</div>
                        <button onclick="window.location.reload()">Reintentar</button>
                    `;
                }
                
            } catch (error) {
                // Error de conexión
                document.getElementById('loader').style.display = 'none';
                document.getElementById('resultado').style.display = 'block';
                document.getElementById('resultado').innerHTML = `
                    <div class="error">❌ Error de conexión</div>
                    <p>Por favor, verifica tu conexión a internet</p>
                    <button onclick="window.location.reload()">Reintentar</button>
                `;
                console.error('Error:', error);
            }
        }
        
        // Iniciar cuando la página esté lista
        document.addEventListener('DOMContentLoaded', redirigir);
    </script>
</body>
</html>
